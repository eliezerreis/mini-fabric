---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-api
  namespace: my-fabric
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-api
  template:
    metadata:
      labels:
        app: profile-api
    spec:
      containers:
        - name: profile-api
          image: myfabric/profile-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fabric-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: profile-api-service
  namespace: my-fabric
spec:
  type: NodePort
  selector:
    app: profile-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
