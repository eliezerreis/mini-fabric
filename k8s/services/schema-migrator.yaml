---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-migrator
  namespace: my-fabric
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-migrator
  template:
    metadata:
      labels:
        app: schema-migrator
    spec:
      containers:
        - name: schema-migrator
          image: myfabric/schema-migrator:latest
          ports:
            - containerPort: 8083
          env:
            - name: SCHEMA_REGISTRY_URL
              value: http://schema-registry-service:8081
---
apiVersion: v1
kind: Service
metadata:
  name: schema-migrator-service
  namespace: my-fabric
spec:
  type: NodePort
  selector:
    app: schema-migrator
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083
