server.port=8085

spring.application.name=profile-consumer
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fabric}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${CONSUMER_GROUP_ID:profile-consumer-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:profileconsumer}" password="${KAFKA_PASSWORD:consumer-secret}";

fabric.kafka.topic.profile-events=profile.events
# Set > 0 to simulate a slow consumer and build lag (milliseconds)
fabric.consumer.simulate-slow-ms=${SIMULATE_SLOW_MS:500}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.prometheus.metrics.export.enabled=true

logging.level.com.myfabric=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=DEBUG
