server.port=8081

spring.application.name=profile-consumer
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fabric}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${CONSUMER_GROUP_ID:profile-consumer-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

fabric.kafka.topic.profile-events=profile.events
# Set > 0 to simulate a slow consumer and build lag (milliseconds)
fabric.consumer.simulate-slow-ms=${SIMULATE_SLOW_MS:0}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.export.prometheus.enabled=true

logging.level.com.myfabric=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO
