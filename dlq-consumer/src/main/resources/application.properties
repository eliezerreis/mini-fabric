server.port=8082

spring.application.name=dlq-consumer
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fabric}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${CONSUMER_GROUP_ID:dlq-consumer-group}
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,info,prometheus

logging.level.com.myfabric=DEBUG
logging.level.org.apache.kafka=WARN
